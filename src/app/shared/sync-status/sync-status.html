<!-- Reihenfolge nach Dringlichkeit: keine Verbindung > Fehler > langsamer Zug. -->
@if (offline()) {
  <div
    role="status"
    class="fixed top-2 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] pointer-events-none
           flex items-center gap-3 rounded-full bg-slate-800/95 text-white
           px-5 py-2.5 shadow-2xl ring-2 ring-white/40"
  >
    <span class="text-xl animate-pulse" aria-hidden="true">🔌</span>
    <span class="text-sm font-bold">{{ 'sync.offline' | transloco }}</span>
  </div>
} @else if (error(); as message) {
  <div
    role="alert"
    class="fixed top-2 left-1/2 -translate-x-1/2 z-50 max-w-[92vw]
           flex items-center gap-3 rounded-2xl bg-amber-100 text-amber-950
           px-4 py-2.5 shadow-2xl ring-2 ring-amber-500"
  >
    <span class="text-xl shrink-0" aria-hidden="true">⚠️</span>
    <span class="text-sm font-bold">{{ message }}</span>
    <button
      type="button"
      (click)="retried.emit()"
      class="shrink-0 rounded-full bg-amber-500 hover:bg-amber-600 text-white
             text-xs font-extrabold px-3 py-1.5 active:scale-95 transition"
    >
      {{ 'sync.retry' | transloco }}
    </button>
    <button
      type="button"
      (click)="dismissed.emit()"
      [attr.aria-label]="'sync.dismiss' | transloco"
      class="shrink-0 w-7 h-7 rounded-full bg-amber-950/10 hover:bg-amber-950/20
             text-amber-950 font-extrabold active:scale-95 transition"
    >
      ✕
    </button>
  </div>
} @else if (awayNames()) {
  <!-- Der Gegner ist nicht mehr verbunden: sichtbar machen, statt still warten. -->
  <div
    role="status"
    class="fixed top-2 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] pointer-events-none
           flex items-center gap-3 rounded-full bg-slate-700/95 text-white
           px-5 py-2 shadow-xl ring-2 ring-white/30"
  >
    <span class="text-lg" aria-hidden="true">🔌</span>
    <span class="text-sm font-bold">{{ 'sync.away' | transloco: { names: awayNames() } }}</span>
  </div>
} @else if (pending()) {
  <div
    role="status"
    class="fixed top-2 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] pointer-events-none
           flex items-center gap-3 rounded-full bg-white/95 text-slate-800
           px-5 py-2 shadow-xl ring-2 ring-slate-300"
  >
    <span class="text-lg animate-spin" aria-hidden="true">⏳</span>
    <span class="text-sm font-bold">{{ 'sync.sending' | transloco }}</span>
  </div>
}
