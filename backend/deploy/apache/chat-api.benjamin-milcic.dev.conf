# Apache vHost for the kids' chat API (Sovica) of the whiteboard app.
#
# Install as /etc/apache2/sites-available/chat-api.benjamin-milcic.dev.conf
# Requires mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_setenvif.
#
# Built from the todo-app vHost. Specific to benjamin-milcic.dev: TLS uses the
# Cloudflare origin certificate (the DNS record must be proxied/orange in
# Cloudflare), and the security-headers snippet and the cf_combined log format
# are defined elsewhere on that server.
#
# Only the API lives here - the frontend is the whiteboard on Firebase Hosting.

<VirtualHost *:80>
    ServerName chat-api.benjamin-milcic.dev
    Redirect permanent / https://chat-api.benjamin-milcic.dev/
</VirtualHost>

<VirtualHost *:443>
    ServerName chat-api.benjamin-milcic.dev

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/origin.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/origin.key

    # No HTML is served here, so the snippet's microphone=() does not matter
    # (the microphone is used on the whiteboard's own origin).
    Include /etc/apache2/snippets/security-headers.conf
    # An API is never embedded (like the api vHost)
    Header always set X-Frame-Options "DENY"

    ErrorLog  ${APACHE_LOG_DIR}/kids-chat-api.error.log
    CustomLog ${APACHE_LOG_DIR}/kids-chat-api.access.log cf_combined

    ProxyRequests Off
    ProxyPreserveHost On
    # Keep the API's JSON error bodies instead of Apache error pages.
    ProxyErrorOverride Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # The answer is streamed as Server-Sent Events: never compress (that would
    # buffer the stream), and allow longer pauses than the usual 60 s - the
    # safety check and the first token can take a while when Groq is busy.
    SetEnvIf Request_URI "^/api/chat/stream" no-gzip=1
    ProxyPass        /api/chat/stream http://127.0.0.1:3200/api/chat/stream timeout=300
    ProxyPassReverse /api/chat/stream http://127.0.0.1:3200/api/chat/stream

    ProxyPass        /api/ http://127.0.0.1:3200/api/ timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:3200/api/

    # Everything else: nothing to see here.
    RedirectMatch 404 ^/(?!api/)
</VirtualHost>
